  :root{
    --ink:#0B2A4A;
    --purple:#0091B9; --deep:#004E9B; --pink:#FF6500; --orange:#FF6500; --cyan:#0091B9; --blue:#004E9B;
    --display:"Outfit","Segoe UI Black","Arial Black","Segoe UI",system-ui,sans-serif;
    --body:"Figtree",Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;}
  html{background:linear-gradient(135deg,#004E9B 0%,#0091B9 40%,#0091B9 80%,#BAE4F0 100%);}
  body{font-family:var(--body);font-weight:600;color:#fff;position:relative;background:transparent;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(circle at 7% 22%, #BAE4F0 0, #FF6500 70px, transparent 71px),
      radial-gradient(circle at 94% 14%, #FFE27A 0, #FF6500 85px, transparent 86px),
      radial-gradient(circle at 90% 84%, #5FB8D6 0, #004E9B 120px, transparent 121px),
      radial-gradient(circle at 10% 86%, #5FB8D6 0, #004E9B 100px, transparent 101px),
      radial-gradient(circle at 22% 52%, #FFE27A 0, #FF6500 44px, transparent 45px),
      radial-gradient(circle at 80% 48%, #FFE27A 0, #FF6500 30px, transparent 31px),
      radial-gradient(circle at 50% 55%, rgba(255,255,255,.12) 0, rgba(255,255,255,.12) 260px, transparent 261px),
      radial-gradient(rgba(255,255,255,.45) 2.5px, transparent 3px);
    background-size:auto,auto,auto,auto,auto,auto,auto,64px 64px;}
  .app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:0 12px calc(12px + env(safe-area-inset-bottom));}
  header{text-align:center;padding:10px 16px 12px;flex-shrink:0;width:calc(100% + 24px);margin:0 -12px;
    background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,40,90,.18);}
  header h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,3.6vw,42px);letter-spacing:.01em;
    text-shadow:0 3px 10px rgba(0,40,90,.25);line-height:1.15;}
  header h1 .the{background:#FF6500;padding:.02em .3em .08em;border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.12);}
  header h1 .seat{color:#FFD500;text-shadow:0 3px 0 rgba(160,60,0,.35);}
  header p{margin:6px 0 0;font-size:clamp(15px,2vw,21px);font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,40,90,.35);}
  #remainingBadge{display:inline-block;margin-top:8px;background:#fff;color:var(--ink);font-family:var(--display);font-weight:700;
    padding:6px 18px;border-radius:999px;font-size:clamp(15px,2vw,20px);box-shadow:0 8px 18px rgba(0,40,90,.25);}

  .wheelWrap{position:relative;flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:10px;}
  #wheelCanvas{display:block;max-width:100%;max-height:100%;border-radius:50%;
    box-shadow:0 0 0 10px #fff, 0 0 0 16px #FFD500, 0 24px 60px rgba(0,40,90,.45);touch-action:manipulation;cursor:pointer;}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;
    margin-top:5px;background:linear-gradient(135deg,#FF8A00,#FF6500 55%,#0091B9);
    box-shadow:0 6px 18px rgba(0,40,90,.5), inset 0 0 0 5px rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#fff;
    font-size:clamp(15px,2.3vw,26px);pointer-events:none;user-select:none;text-align:center;line-height:1.05;text-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:24px solid transparent;border-right:24px solid transparent;border-top:42px solid #FF6500;
    filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 6px rgba(0,40,90,.5));z-index:5;pointer-events:none;}
  .pointer::after{content:"";position:absolute;left:-12px;top:-38px;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#FFE9C7);}

  .controls{flex-shrink:0;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:14px 16px;margin-top:10px;
    width:100%;max-width:980px;background:#fff;border-radius:999px;box-shadow:0 18px 40px rgba(0,40,90,.25);}
  button{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.3vw,24px);border:none;border-radius:999px;
    padding:12px 26px;min-height:64px;min-width:64px;cursor:pointer;color:#fff;
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s ease;touch-action:manipulation;}
  button:focus-visible{outline:5px solid #FFD500;outline-offset:3px;}
  button:active{transform:translateY(3px);}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  #spinBtn{background:linear-gradient(135deg,#FF8A00,#FF6500 50%,#0091B9);box-shadow:0 6px 0 #B34700,0 12px 24px rgba(255,101,0,.35);}
  #spinBtn:active{box-shadow:0 2px 0 #B34700;}
  #shuffleBtn{background:linear-gradient(135deg,#004E9B,#0091B9);box-shadow:0 6px 0 #003A75,0 12px 24px rgba(0,78,155,.3);}
  #shuffleBtn:active{box-shadow:0 2px 0 #003A75;}
  #resetBtn,#muteBtn{background:#fff;color:#004E9B;border:3px solid #BAE4F0;box-shadow:0 6px 0 #BAE4F0;}
  #resetBtn:active,#muteBtn:active{box-shadow:0 2px 0 #BAE4F0;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,30,70,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .overlay.show{display:flex;}
  .modal{position:relative;overflow:hidden;background:#fff;color:var(--ink);border-radius:36px;max-width:960px;width:100%;
    padding:clamp(28px,5vw,60px);text-align:center;box-shadow:0 30px 70px rgba(0,30,70,.5);animation:pop .32s cubic-bezier(.2,.9,.3,1.35);}
  .modal::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(90deg,#FF8A00,#FF6500 50%,#0091B9);}
  .modal::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;bottom:-90px;
    background:radial-gradient(circle at 35% 35%,#FFE27A,#FF6500);opacity:.25;pointer-events:none;}
  @keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .label{display:inline-block;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.2vw,22px);letter-spacing:.06em;
    color:#fff;background:linear-gradient(135deg,#FF6500,#FFD500);padding:6px 18px;border-radius:999px;margin-bottom:18px;}
  .modal .winText{font-family:var(--display);font-weight:700;font-size:clamp(28px,5.2vw,58px);line-height:1.2;color:var(--ink);position:relative;z-index:1;}
  .modal button{margin-top:30px;position:relative;z-index:1;background:linear-gradient(135deg,#FF8A00,#FF6500 50%,#0091B9);color:#fff;
    font-size:clamp(20px,2.6vw,26px);padding:14px 44px;box-shadow:0 6px 0 #B34700,0 12px 24px rgba(255,101,0,.35);}

<script>
(function(){

  // ---------- Source data (numbers already stripped) ----------
  const ALL_ITEMS = ["Line up by your wake-up time this morning (earliest to latest).", "Line up by your bedtime last night (earliest to latest).", "Line up by how long you take to shower (shortest time to longest time).", "Line up by how much sleep you get on weekends (least sleep to most sleep).", "Line up by your breakfast time (fastest meal to longest meal).", "Line up by the size of your breakfast today (no breakfast to a very big breakfast).", "Line up by how many languages you can speak (fewest to most).", "Line up by how many siblings you have (no brothers or sisters to the most).", "Line up by how many pets you have at home (zero pets to the most pets).", "Line up by how many keys you have right now (zero keys to the most keys).", "Line up by how many countries you have visited (fewest to most).", "Line up by how many cousins you have (zero cousins to the most).", "Line up by your phone battery percentage right now (lowest to highest).", "Line up by the number of unread messages on your phone (zero to the most).", "Line up by your daily phone screen time yesterday (fewest hours to most hours).", "Line up by how many apps are open on your phone right now (lowest to highest).", "Line up by the total number of photos on your phone (fewest to most).", "Line up by how many apps you have on your phone home screen (fewest to most).", "Line up by how many video streaming accounts you pay for (zero to the most).", "Line up by the number of names in your phone contact list (fewest to most).", "Line up by the number of group chats you are in (fewest to most).", "Line up by the age of your phone (oldest phone model to the newest phone model).", "Line up by how many hours you watch TikTok or Reels every day (zero hours to the most).", "Line up by your typing speed on a phone (slowest thumb-typers to fastest texters).", "Line up by how often you wear earbuds or headphones (rarely wear them to wear them all day and night).", "Line up by your travel time to school (shortest time to longest time).", "Line up by how close you live to St Leonards TAFE (closest to furthest away).", "Line up by how many buses or trains you take to school (zero to the most).", "Line up by how many train stops you pass to get to school (fewest to most).", "Line up by your school arrival time (exactly on time to very early).", "Line up by how long you can walk around the city before you get tired (shortest time to longest time).", "Line up by your driving experience (zero driving lessons to already having a licence).", "Line up by your airport arrival habit (arrive very early to running to the boarding gate at the last minute).", "Line up by how many cups of coffee or tea you drink every day (zero cups to the most).", "Line up by how much water you drink every day (least water to most water).", "Line up by how much you like spicy food (hate spicy food to love spicy food).", "Line up by how many snacks you have in your bag right now (zero snacks to the most).", "Line up by your dinner time (earliest dinner to latest dinner).", "Line up by how often you cook at home (never cook to cook every day).", "Line up by how often you eat fast food every month (never to the most).", "Line up by how often you go to the supermarket (once a month to every day).", "Line up by the type of fruit you like (very sour fruit to very sweet fruit).", "Line up by how many spoons of sugar you put in your tea or coffee (zero spoons to the most).", "Line up by your shoe size (smallest to largest).", "Line up by the colour of your shoes today (darkest black shoes to lightest white shoes).", "Line up by the cleanliness of your shoes (dirty or muddy shoes to brand new shoes).", "Line up by the height of your socks today (very short ankle socks to high knee socks).", "Line up by how many pockets you have on your clothes right now (zero pockets to the most).", "Line up by how many pairs of shoes you own at home (fewest to most).", "Line up by how often you wear a hat or a cap (never wear hats to wear a hat every day).", "Line up by how much black clothing you are wearing today (no black clothes to all black clothes).", "Line up by how many items of jewellery you are wearing right now (zero to the most).", "Line up by the length of your fingernails (very short to very long).", "Line up by the number of clothing layers you are wearing today (one t-shirt to many layers).", "Line up by the weight of your school bag today (lightest bag to heaviest bag).", "Line up by the size of your pencil case (no pencil case to a very big pencil case).", "Line up by how much you talk in class (very quiet listener to loudest talker).", "Line up by your role in group work (quiet follower to group leader).", "Line up by how many highlighters you own (zero highlighters to the most).", "Line up by where you like to sit in the classroom (absolute back row to the front desk).", "Line up by your height (shortest to tallest).", "Line up by your month of birth (January to December).", "Line up by the day of the month you were born (ignore the month).", "Line up by the first letter of your first name (A to Z).", "Line up by the first letter of your last name (Z to A).", "Line up by the number of letters in your street name (shortest name to longest name).", "Line up by your energy level right now (lowest energy to highest energy).", "Line up by how many coins you have in your wallet right now (zero coins to a heavy pocket of coins).", "Line up by the hand you use to write (left-handed to right-handed).", "Line up by your punctuality (always late to always early).", "Line up by your voice volume when you speak (quietest whisper to loudest voice).", "Line up by how many chores or housework jobs you do at home (zero chores to the most).", "Line up by the height of your home building (ground-floor apartment to a tall house with many floors).", "Line up by the age of your house or apartment building (brand new building to a very old house).", "Line up by the size of your backyard (no outdoor space to a very big yard).", "Line up by how loud your street is at home (perfectly silent to a very noisy street).", "Line up by your home walls (a quiet house with a big yard to a busy apartment with neighbors on all sides).", "Line up by how many languages your family speaks at home (only English to three or more languages).", "Line up by how often you go shopping at the mall on Thursday nights (never to every Thursday).", "Line up by how many Sydney animals you see near your home, like possums, bush turkeys or blue-tongue lizards (only pigeons to many wild animals).", "Line up by how often you watch movies (rarely watch movies to the biggest movie fan).", "Line up by how many episodes of Anime you have watched in your life (zero episodes to many full series).", "Line up by how easy it is for you to write the English alphabet (hardest to easiest).", "Line up by how often you use a dictionary app (use it for every word to never open it).", "Line up by how you use translation apps (type full sentences to use voice or camera translation instantly).", "Line up by your English reading speed (slow sentence-by-sentence reading to scanning a page quickly).", "Line up by how you type on an English keyboard (slow look-and-type with two fingers to fast typing with all fingers).", "Line up by how often you stop to fix your grammar mistakes when speaking (never stop to stop mid-sentence every time).", "Line up by how many hours of exercise or sport you do every week (zero hours to many hours).", "Line up by your daily walking steps yesterday (fewest steps to most steps).", "Line up by how close you can get to touching your toes when stretching (cannot touch knees to easily touching toes).", "Line up by your swimming confidence in the deep ocean water (stay in the shallow water to swim in big waves).", "Line up by how often you go to the gym every week (never go to go every day)."];

  // Vibrant contrasting palette, cycled around the wheel
  const PALETTE = [
    "#004E9B", "#FF6500", "#0091B9", "#FFC400", "#00708F",
    "#FF8A00", "#003A75", "#5FB8D6", "#E05500", "#D9A400"

  // ---------- State ----------
  // Each wedge keeps a stable colour tied to its original index so colours
  // don't jump around every time the wheel shrinks.
  let wedges = ALL_ITEMS.map((text, i) => ({
    text: text,
    color: PALETTE[i % PALETTE.length]
  }));

  let rotation = 0;          // current wheel rotation in radians
  let spinning = false;
  let soundOn = true;
  let audioCtx = null;

  const hubLabel = document.getElementById("hubLabel");
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const wheelWrap = document.querySelector(".wheelWrap");
  const remainingBadge = document.getElementById("remainingBadge");
  const spinBtn = document.getElementById("spinBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const resetBtn = document.getElementById("resetBtn");
  const muteBtn = document.getElementById("muteBtn");
  const overlay = document.getElementById("overlay");
  const winText = document.getElementById("winText");
  const closeModalBtn = document.getElementById("closeModalBtn");

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Sizing ----------
  function sizeCanvas(){
    const available = Math.min(wheelWrap.clientWidth, wheelWrap.clientHeight);
    const size = Math.max(140, Math.floor(available * 0.96));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep the hub round and the pointer touching the wheel at any screen size
    const hubSize = Math.max(64, Math.round(size * 0.18));
    hubLabel.style.width = hubSize + "px";
    hubLabel.style.height = hubSize + "px"; hubLabel.style.fontSize = Math.max(16, Math.round(hubSize * 0.26)) + "px";
    hubLabel.style.top = (canvas.offsetTop + size / 2) + "px";
    hubLabel.style.marginTop = "0";
    const pointerEl = wheelWrap.querySelector(".pointer");
    if (pointerEl){ const ps = Math.max(0.75, Math.min(2.6, size / 560)); pointerEl.style.top = Math.max(0, canvas.offsetTop - 22 * ps) + "px"; pointerEl.style.transform = "translateX(-50%) scale(" + ps + ")"; }
    drawWheel();
  }

  // ---------- Drawing ----------
  function drawWheel(){
    const size = canvas.clientWidth;
    const cx = size / 2;
    const cy = size / 2;
    const radius = size / 2 - 4;
    const n = wedges.length;

    ctx.clearRect(0, 0, size, size);

    if (n === 0){
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "#0091B9";
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold " + Math.round(size * 0.07) + "px Outfit, Figtree, Segoe UI, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("All done!", 0, 0);
      ctx.restore();
      return;
    }

    const anglePer = (Math.PI * 2) / n;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    for (let i = 0; i < n; i++){
      const start = i * anglePer;
      const end = start + anglePer;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = wedges[i].color;
      ctx.fill();
      ctx.lineWidth = Math.max(1, size * 0.003);
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.stroke();

      ctx.save();
      ctx.rotate(start + anglePer / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,30,70,0.55)";

      ctx.fillText(String(i + 1), radius - size * 0.02, 0);
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- Audio (Web Audio API synth, no external files) ----------
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }

  function playSpinSound(durationSec){
    if (!soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;

    // Decelerating ratchet clicks, like a wheel slowing down
    let t = 0;
    let interval = 0.045;
    const growth = 1.055;
    while (t < durationSec){
      const clickTime = now + t;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(720 + Math.random() * 180, clickTime);
      gain.gain.setValueAtTime(0.001, clickTime);
      gain.gain.linearRampToValueAtTime(0.18, clickTime + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, clickTime + 0.045);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(clickTime);
      osc.stop(clickTime + 0.05);
      t += interval;
      interval *= growth;
    }

    // Rising energetic sweep under the clicks for the first second
    const sweep = audioCtx.createOscillator();
    const sweepGain = audioCtx.createGain();
    sweep.type = "sawtooth";
    sweep.frequency.setValueAtTime(90, now);
    sweep.frequency.exponentialRampToValueAtTime(260, now + Math.min(1, durationSec));

    sweepGain.gain.linearRampToValueAtTime(0.0001, now + Math.min(1, durationSec));

    sweep.start(now);
    sweep.stop(now + Math.min(1, durationSec));
  }

      osc.connect(gain).connect(audioCtx.destination);
      osc.start(startAt);
      osc.stop(startAt + 0.4);
    });
  }

  // ---------- Spin logic ----------
  function updateBadge(){
    const n = wedges.length;
    remainingBadge.textContent = n + (n === 1 ? " question left" : " questions left");
  }

  function easeOutCubic(x){
    return 1 - Math.pow(1 - x, 3);
  }

  function spin(){
    if (spinning || wedges.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    shuffleBtn.disabled = true;
    resetBtn.disabled = true;
    hubLabel.textContent = "GO!";

    ensureAudio();

    const duration = prefersReducedMotion ? 900 : 4200; // ms
    const soundDuration = duration / 1000;
    playSpinSound(soundDuration);

    const n = wedges.length;
    const anglePer = (Math.PI * 2) / n;

    // Pick the winning wedge index up front
    const winnerIndex = Math.floor(Math.random() * n);

    // The pointer sits at the top (angle = -PI/2 in canvas terms, i.e. 12 o'clock).
    // We want the middle of the winner wedge to end up at the pointer.
    const winnerMidAngle = winnerIndex * anglePer + anglePer / 2;
    const extraSpins = (prefersReducedMotion ? 2 : 6) + Math.floor(Math.random() * 3);
    const targetPointerAngle = -Math.PI / 2; // top of circle
    // rotation needed so that (winnerMidAngle + rotation) mod 2PI == targetPointerAngle
    let targetRotation = targetPointerAngle - winnerMidAngle + extraSpins * Math.PI * 2;

    // keep spinning forward relative to current rotation
    while (targetRotation < rotation + extraSpins * Math.PI * 2 - Math.PI * 2){
      targetRotation += Math.PI * 2;
    }
    const startRotation = rotation;
    const delta = targetRotation - startRotation;
    const startTime = performance.now();

    function frame(now){
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(progress);
      rotation = startRotation + delta * eased;
      drawWheel();

      if (progress < 1){
        requestAnimationFrame(frame);
      } else {
        rotation = startRotation + delta;
        rotation = rotation % (Math.PI * 2);
        drawWheel();
        onSpinComplete(winnerIndex);
      }
    }
    requestAnimationFrame(frame);
  }

  function onSpinComplete(winnerIndex){
    spinning = false;
    hubLabel.textContent = "SPIN";
    playWinChime();
    showModal(wedges[winnerIndex].text, winnerIndex);
  }

  let pendingRemoveIndex = null;

  function showModal(text, index){
    winText.textContent = text;
    pendingRemoveIndex = index;
    overlay.classList.add("show");
  }

  function closeModal(){
    overlay.classList.remove("show");
    if (pendingRemoveIndex !== null){
      wedges.splice(pendingRemoveIndex, 1);
      pendingRemoveIndex = null;
    }
    updateBadge();
    drawWheel();
    spinBtn.disabled = wedges.length === 0;
    shuffleBtn.disabled = wedges.length === 0;
    resetBtn.disabled = false;
    if (wedges.length === 0){
      hubLabel.textContent = "DONE";
    }
  }

  function shuffleWedges(){
    if (spinning) return;
    for (let i = wedges.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = wedges[i];
      wedges[i] = wedges[j];
      wedges[j] = tmp;
    }
    drawWheel();
  }

  function resetWheel(){
    if (spinning) return;
    wedges = ALL_ITEMS.map((text, i) => ({
      text: text,
      color: PALETTE[i % PALETTE.length]
    }));
    rotation = 0;
    hubLabel.textContent = "SPIN";
    spinBtn.disabled = false;
    shuffleBtn.disabled = false;
    updateBadge();
    drawWheel();
  }

  function toggleSound(){
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Muted";
    if (soundOn) ensureAudio();
  }

  // ---------- Wire up ----------
  spinBtn.addEventListener("click", spin);
  shuffleBtn.addEventListener("click", shuffleWedges);
  resetBtn.addEventListener("click", resetWheel);
  muteBtn.addEventListener("click", toggleSound);
  closeModalBtn.addEventListener("click", closeModal);
  canvas.addEventListener("click", () => { if (!spinning) spin(); });

  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  window.addEventListener("resize", sizeCanvas);
  window.addEventListener("orientationchange", sizeCanvas);

  // Init
  updateBadge();
  sizeCanvas();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);
})();
</script>
<script>
/* toolkit home button: folder on a computer, same GitHub repository, or the teachers-toolkit repository */
(function(){
  var a = document.getElementById("toolkitHome"); if(!a) return;
  var REL = "Teachers_Toolkit_Home.html", REPOS = ["/teacherstoolkit/", "/teachers-toolkit/"];
  if(location.protocol === "file:"){ a.href = REL; return; }
  var gh = location.hostname.indexOf("github.io") > -1;
  a.href = gh ? REPOS[0] : REL;
  try{
    var head = function(u){ return fetch(u, {method:"HEAD", cache:"no-store"}).then(function(r){ return r.ok; }).catch(function(){ return false; }); };
    var tryAll = function(list, i){
      if(i >= list.length){ if(gh) a.href = REPOS[0]; return; }
      head(list[i]).then(function(y){ if(y) a.href = list[i]; else tryAll(list, i + 1); });
    };
    tryAll([REL].concat(REPOS), 0);
  }catch(e){}
})();
</script>
